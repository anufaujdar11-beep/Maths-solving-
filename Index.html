<!DOCTYPE html>
<html>
<head>
  <title>Aesthetic Calculator</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      font-family: Arial;
    }

    .calculator {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    #display {
      width: 100%;
      height: 60px;
      border: none;
      border-radius: 10px;
      text-align: right;
      font-size: 22px;
      padding: 10px;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.5);
    }

    button {
      width: 80px;
      height: 80px;
      margin: 10px;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      cursor: pointer;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(5px);
      transition: 0.2s;
    }

    button:hover {
      background: rgba(255,255,255,0.6);
      transform: scale(1.05);
    }

    .equal {
      background: #6a11cb;
      color: white;
    }

    .clear {
      background: #ff4b5c;
      color: white;
    }
  </style>
</head>

<!DOCTYPE html>
<html>
<head>
  <title>Aesthetic Calculator</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #fbc2eb, #a6c1ee);
      font-family: Arial;
    }

    .calculator {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    }

    #display {
      width: 100%;
      height: 60px;
      border: none;
      border-radius: 10px;
      text-align: right;
      font-size: 22px;
      padding: 10px;
      margin-bottom: 15px;
      background: rgba(255,255,255,0.5);
    }

    button {
      width: 60px;
      height: 60px;
      margin: 5px;
      border: none;
      border-radius: 15px;
      font-size: 18px;
      cursor: pointer;
      background: rgba(255,255,255,0.3);
      backdrop-filter: blur(5px);
      transition: 0.2s;
    }

    button:hover {
      background: rgba(255,255,255,0.6);
      transform: scale(1.05);
    }

    .equal {
      background: #6a11cb;
      color: white;
    }

    .clear {
      background: #ff4b5c;
      color: white;
    }
  </style>
</head>

<body>
<div class="wrapper">

<!-- 4 CORNER STICKERS (ONLY ONE EACH) -->
<div class="corner top-left">🍓</div>
<div class="corner top-right">🌸</div>
<div class="corner bottom-left">🍭</div>
<div class="corner bottom-right">🌈</div>

<!-- SCATTERED OUTSIDE STICKERS -->
<div class="float" style="top:-100px; left:-150px">✨</div>
<div class="float" style="top:-120px; right:-140px">🎀</div>
<div class="float" style="bottom:-120px; left:-130px">🦩</div>
<div class="float" style="bottom:-140px; right:-150px">🌼</div>
<div class="float" style="top:50%; left:-200px">🍀</div>
<div class="float" style="top:40%; right:-200px">⭐</div>
<div class="calculator">
  <input type="text" id="display" readonly>

  <div>
    <button onclick="press('7')">7</button>
    <button onclick="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button onclick="press('/')">÷</button>
  </div>

  <div>
    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button onclick="press('*')">×</button>
  </div>

  <div>
    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button onclick="press('-')">−</button>
  </div>

  <div>
    <button onclick="press('0')">0</button>
    <button onclick="press('.')">.</button>
    <button class="equal" onclick="calculate()">=</button>
    <button onclick="press('+')">+</button>
  </div>

  <div>
    <button class="clear" onclick="clearDisplay()">C</button>
  </div>
</div>

<script>
function press(val) {
  document.getElementById("display").value += val;
}

function calculate() {
  try {
    document.getElementById("display").value =
      eval(document.getElementById("display").value);
  } catch {
    alert("Error");
  }
}

function clearDisplay() {
  document.getElementById("display").value = "";
}
</script>

</body>
</html>
